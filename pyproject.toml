[project]
name = "nonlinear-dynamics-chaos-lab"
version = "1.1.0"
readme = "README.md"
keywords = ["nonlinear dynamics", "chaos", "double pendulum", "lyapunov", "computational physics"]
description = "Interactive and numerically validated nonlinear pendulum laboratory"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "mpmath>=1.3,<2",
  "pandas>=2.1,<3",
  "plotly>=5.20,<7",
  "streamlit>=1.41,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*_lab*"]
