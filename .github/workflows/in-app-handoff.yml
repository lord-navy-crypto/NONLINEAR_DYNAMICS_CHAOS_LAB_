name: In-app setup handoff smoke check

on:
  pull_request:
    paths: ["app.py", ".github/workflows/in-app-handoff.yml"]
  push:
    branches: [main]
    paths: ["app.py", ".github/workflows/in-app-handoff.yml"]

jobs:
  syntax-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Streamlit source and local configuration snapshot UX
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("app.py").read_text(encoding="utf-8")
          compile(text, "app.py", "exec")
          assert "Pin current setup" in text
          assert "Restore pinned setup" in text
          assert "lyap_result" in text
          print("PASS: Chaos experiment in-app snapshot controls")
          PY
